<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYAR ONLINE STORE</title>
<meta name="description" content="Everyday essentials from BYAR Online Store. Build your list and order by WhatsApp.">
<meta name="theme-color" content="#1f6b4f">
<link rel="canonical" href="https://byar-general-store.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BYAR ONLINE STORE">
<meta property="og:title" content="BYAR ONLINE STORE">
<meta property="og:description" content="Everyday grocery, household and personal care essentials. Order in minutes and get it by WhatsApp.">
<meta property="og:image" content="https://byar-general-store.netlify.app/images/og-cover.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://byar-general-store.netlify.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BYAR ONLINE STORE">
<meta name="twitter:description" content="Everyday grocery, household and personal care essentials. Order in minutes and get it by WhatsApp.">
<meta name="twitter:image" content="https://byar-general-store.netlify.app/images/og-cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%9B%92%3C/text%3E%3C/svg%3E">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"GroceryStore","name":"BYAR ONLINE STORE","image":"https://byar-general-store.netlify.app/images/og-cover.jpg","url":"https://byar-general-store.netlify.app/","priceRange":"$"}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1f6b4f;--ink:#1d2a25;--paper:#f7f8f5;--line:#d9dfd8;--sun:#f2c230;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#eef2ee;--paper:#141a17;--line:#2c3832;--card:#1c2521}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5}
html[dir=rtl] body{font-family:"Noto Nastaliq Urdu","Bricolage Grotesque",system-ui,sans-serif;line-height:2}
html[dir=rtl] aside{right:auto;left:0;border-left:none;border-right:4px solid var(--sun)}
html[dir=rtl] .cartbtn{order:2}
.awning{height:22px;background:repeating-linear-gradient(90deg,var(--green) 0 28px,#fff 28px 56px);border-bottom:4px solid var(--sun)}
header{max-width:960px;margin:0 auto;padding:28px 20px 12px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(2rem,7vw,3.4rem);font-weight:800;line-height:1;letter-spacing:-.02em}
header p{margin:6px 0 0;max-width:34ch}
.cartbtn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
main{max-width:960px;margin:0 auto;padding:8px 20px 80px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}
input[type=search]{flex:1 1 200px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--card);color:inherit}
.chip{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:6px}
.item h3{margin:0;font-size:1.05rem}
.item small{color:var(--green)}
.price{font-weight:800;font-size:1.2rem;margin-top:auto}
.ph{height:110px;border-radius:6px;background:var(--line) center/cover;display:grid;place-items:center;font-weight:800;font-size:2rem;color:var(--green)}
.out{opacity:.6}.out .add{border-color:var(--line);color:inherit;cursor:not-allowed}.out .add:hover{background:transparent;color:inherit}
.info{margin-top:36px;padding:20px;border:1px solid var(--line);border-left:4px solid var(--sun);border-radius:8px;background:var(--card)}
.info h2{margin:0 0 6px}.info p{margin:2px 0}
.add{margin-top:6px;border:2px solid var(--green);background:transparent;color:inherit;border-radius:8px;padding:8px;font:inherit;font-weight:600;cursor:pointer}
.add:hover{background:var(--green);color:#fff}
.empty{padding:40px 0;color:var(--green)}
aside{position:fixed;inset:0 0 0 auto;width:min(380px,100%);background:var(--card);border-left:4px solid var(--sun);transform:translateX(100%);transition:transform .25s;padding:20px;display:flex;flex-direction:column;overflow:auto}
aside.open{transform:none}
aside h2{margin:0 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.qty button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:transparent;color:inherit;cursor:pointer}
.mode{border:1px solid var(--line);border-radius:8px;margin:14px 0 0;padding:8px 12px}.mode label{margin-right:14px}
#addr,#cname,#pay,#tid{width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--paper);color:inherit}
.paynote{font-size:.9rem;margin:6px 0 0}.paynote a{color:var(--green);font-weight:600}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:1.2rem;margin:16px 0}
.order{background:#25a244;color:#fff;border:0;border-radius:8px;padding:14px;font:inherit;font-weight:600;cursor:pointer}
.close{align-self:flex-end;background:none;border:0;color:inherit;font:inherit;cursor:pointer;text-decoration:underline}
footer{text-align:center;padding:24px;border-top:1px solid var(--line);font-size:.9rem}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<div class="awning"></div>
<header>
  <div>
    <h1>BYAR<br>ONLINE STORE</h1>
    <p>Everyday essentials. Pick your items and send the list to us on WhatsApp.</p>
  </div>
  <button class="cartbtn" id="openCart" data-en="Your list (" data-ur="آپ کی فہرست (">Your list (<span id="count">0</span>)</button>
  <button class="chip" id="langBtn" aria-label="Switch language">اردو</button>
</header>
<main>
  <div class="tools">
    <input type="search" id="q" placeholder="Search items" aria-label="Search items">
    <span id="chips" role="group" aria-label="Categories"></span>
  </div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No items match. Try another word or category.</p>
  <section class="info" id="info"></section>
</main>
<aside id="cart" aria-label="Your list">
  <button class="close" id="closeCart" data-en="Close" data-ur="بند کریں">Close</button>
  <h2 id="cartTitle">Your list</h2>
  <div id="lines"></div>
  <fieldset class="mode"><legend id="howLbl">How do you want it?</legend>
    <label><input type="radio" name="mode" value="Pickup" checked> <span id="pickupLbl">Pickup</span></label>
    <label><input type="radio" name="mode" value="Delivery"> <span id="deliveryLbl">Delivery</span></label>
  </fieldset>
  <input id="cname" placeholder="Your name" aria-label="Your name">
  <input id="addr" placeholder="Delivery address" aria-label="Delivery address" hidden>
  <select id="pay" aria-label="Payment method"></select>
  <p class="paynote" id="paynote"></p>
  <input id="tid" placeholder="Transaction ID from the payment app" aria-label="Transaction ID" hidden>
  <div class="total"><span id="totalLbl">Total</span><span id="total">0</span></div>
  <button class="order" id="order">Send order on WhatsApp</button>
</aside>
<footer>BYAR ONLINE STORE · Open daily · Sprint 10 release</footer>

<script>
// ---- Store settings: edit these ----
const STORE = { name: "BYAR ONLINE STORE", whatsapp: "923199000856", currency: "Rs " }; // WhatsApp number: country code + number, digits only
// Products, hours and address live in products.json
let PRODUCTS = [], INFO = {}, STOCK = {};
const oos = p => p.inStock === false || STOCK[p.id] === 0;
function loadStock() { fetch("/api/stock").then(r => r.ok ? r.json() : {}).then(x => { STOCK = x || {}; shop(); }).catch(() => {}); }


const STR = {
  en: { search:"Search items", empty:"No items match. Try another word or category.",
    add:"Add to list", out:"Out of stock", emptyCart:"Your list is empty. Add items from the store.",
    order:"Send order on WhatsApp", visit:"Visit us", hours:"Hours", address:"Address", phone:"Phone",
    total:"Total", yourList:"Your list", name:"Your name", addr:"Delivery address", pickup:"Pickup", delivery:"Delivery", how:"How do you want it?" },
  ur: { search:"چیزیں تلاش کریں", empty:"کوئی چیز نہیں ملی۔ دوسرا لفظ یا کیٹگری آزمائیں۔",
    add:"فہرست میں شامل کریں", out:"سٹاک ختم", emptyCart:"آپ کی فہرست خالی ہے۔ سٹور سے چیزیں شامل کریں۔",
    order:"واٹس ایپ پر آرڈر بھیجیں", visit:"ہم سے ملیں", hours:"اوقات", address:"پتہ", phone:"فون",
    total:"کل رقم", yourList:"آپ کی فہرست", name:"آپ کا نام", addr:"ڈیلیوری کا پتہ", pickup:"خود لینا", delivery:"ڈیلیوری", how:"آپ کیسے لینا چاہتے ہیں؟" }
};
let LANG = (localStorage.getItem("byar-lang") || "en");
document.documentElement.dir = LANG === "ur" ? "rtl" : "ltr";
function T(k) { return STR[LANG][k]; }
const $ = id => document.getElementById(id);
let cat = "All", cart = {};
try { cart = JSON.parse(localStorage.getItem("byar-cart")) || {}; } catch (e) {}
const money = n => STORE.currency + n.toFixed(2);
const save = () => { try { localStorage.setItem("byar-cart", JSON.stringify(cart)); } catch (e) {} };

function chips() {
  const cats = ["All", ...new Set(PRODUCTS.map(p => p.cat))];
  $("chips").innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c === cat}" data-c="${c}">${c}</button>`).join(" ");
}
function shop() {
  const q = $("q").value.trim().toLowerCase();
  const list = PRODUCTS.filter(p => (cat === "All" || p.cat === cat) && p.name.toLowerCase().includes(q));
  $("grid").innerHTML = list.map(p => `<div class="item${oos(p)?' out':''}"><div class="ph"${p.image?` style="background-image:url('${p.image}')"`:""}>${p.image?"":p.name[0]}</div><small>${LANG==="ur"?(p.cat_ur||p.cat):p.cat}${STOCK[p.id] > 0 && STOCK[p.id] <= 5 ? " · " + STOCK[p.id] : ""}</small><h3>${LANG==="ur"?(p.name_ur||p.name):p.name}</h3><div class="price">${money(p.price)}</div><button class="add" data-id="${p.id}"${oos(p)?" disabled":""}>${oos(p)?T("out"):T("add")}</button></div>`).join("");
  $("empty").hidden = list.length > 0;
  $("empty").textContent = T("empty");
  $("q").placeholder = T("search");
}
function basket() {
  const ids = Object.keys(cart).filter(id => cart[id] > 0);
  let total = 0, n = 0;
  $("lines").innerHTML = ids.length ? ids.map(id => {
    const p = PRODUCTS.find(x => x.id == id); if (!p) return "";
    total += p.price * cart[id]; n += cart[id];
    return `<div class="row"><span>${LANG==="ur"?(p.name_ur||p.name):p.name}<br><small>${money(p.price)} each</small></span><span class="qty"><button data-m="${id}" aria-label="Remove one">−</button> ${cart[id]} <button data-p="${id}" aria-label="Add one">+</button></span></div>`;
  }).join("") : `<p>${T("emptyCart")}</p>`;
  $("total").textContent = money(total);
  $("count").textContent = n;
  $("order").disabled = !n;
  save();
}
$("chips").onclick = e => { if (e.target.dataset.c) { cat = e.target.dataset.c; chips(); shop(); } };
$("q").oninput = shop;
$("grid").onclick = e => { const id = e.target.dataset.id; if (id) { cart[id] = (cart[id] || 0) + 1; basket(); } };
$("lines").onclick = e => {
  const { p, m } = e.target.dataset;
  if (p) cart[p]++;
  if (m) cart[m] = Math.max(0, cart[m] - 1);
  basket();
};
$("openCart").onclick = () => $("cart").classList.add("open");
$("closeCart").onclick = () => $("cart").classList.remove("open");
const mode = () => document.querySelector('input[name=mode]:checked').value;
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = () => { $("addr").hidden = mode() !== "Delivery"; });
$("order").onclick = async () => {
  if (!$("tid").hidden && !$("tid").value.trim()) { $("tid").focus(); $("tid").placeholder = "Enter the transaction ID to confirm payment"; return; }
  if (mode() === "Delivery" && !$("addr").value.trim()) { $("addr").focus(); $("addr").placeholder = "Enter your delivery address"; return; }
  const chosen = Object.keys(cart).filter(id => cart[id] > 0);
  const lines = chosen.map(id => { const p = PRODUCTS.find(x => x.id == id); return `• ${p.name} x${cart[id]} = ${money(p.price * cart[id])}`; });
  const totalText = $("total").textContent;
  let orderId = "";
  $("order").disabled = true;
  try {
    const r = await fetch("/api/order", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ items: chosen.map(id => ({ id: +id, qty: cart[id] })), mode: mode(), name: $("cname").value, address: $("addr").value, payment: $("pay").value, tid: $("tid").value }) });
    if (r.status === 409 || r.status === 400) { const e = await r.json(); alert(e.error); loadStock(); basket(); return; }
    if (r.ok) orderId = (await r.json()).orderId;
  } catch (e) {}
  const msg = `Hello ${STORE.name}, I would like to order${orderId ? " #" + orderId : ""}:\n${lines.join("\n")}\nTotal: ${totalText}\n${mode()}${mode() === "Delivery" ? ": " + $("addr").value.trim() : ""}\nName: ${$("cname").value.trim() || "-"}\nPayment: ${$("pay").value}${!$("tid").hidden ? " (TID: " + $("tid").value.trim() + ")" : ""}`;
  if (orderId) { cart = {}; loadStock(); }
  basket();
  const url = `https://wa.me/${STORE.whatsapp}?text=${encodeURIComponent(msg)}`;
  window.open(url, "_blank") || (window.location.href = url);
};
function payUI() {
  const P = INFO.payment || {};
  const link = /^https:\/\//.test(P.payLink || "") ? P.payLink : "";
  const methods = [...(P.methods && P.methods.length ? P.methods : ["Cash"])];
  if (link) methods.push("Pay online (card)");
  $("pay").innerHTML = methods.map(m => `<option>${m}</option>`).join("");
  const note = () => {
    const m = $("pay").value;
    $("tid").hidden = !/jazzcash|easypaisa|wallet/i.test(m);
    $("paynote").innerHTML = m === "Pay online (card)" ? `<a href="${link}" target="_blank" rel="noopener">Pay online now</a> (then send your order)` : (/transfer/i.test(m) ? (P.transferNote || "") : "");
  };
  $("pay").onchange = note; note();
}
function applyLang() {
  $("langBtn").textContent = LANG === "en" ? "اردو" : "English";
  $("cartTitle").textContent = T("yourList");
  $("totalLbl").textContent = T("total");
  $("order").textContent = T("order");
  $("cname").placeholder = T("name");
  $("addr").placeholder = T("addr");
  $("howLbl").textContent = T("how");
  $("pickupLbl").textContent = T("pickup");
  $("deliveryLbl").textContent = T("delivery");
}
$("langBtn").onclick = () => {
  LANG = LANG === "en" ? "ur" : "en";
  try { localStorage.setItem("byar-lang", LANG); } catch (e) {}
  document.documentElement.dir = LANG === "ur" ? "rtl" : "ltr";
  applyLang(); shop(); basket(); infoBox();
};
function infoBox() {
  $("info").innerHTML = `<h2>${T("visit")}</h2><p>${T("hours")}: ${INFO.hours || ""}</p><p>${T("address")}: ${INFO.address || ""}</p><p>${T("phone")}: ${INFO.phone || ""}</p>`;
}
fetch("products.json").then(r => r.json()).then(d => {
  PRODUCTS = d.products; INFO = d.store || {};
  applyLang(); chips(); shop(); basket(); infoBox(); payUI(); loadStock();
}).catch(() => { $("grid").innerHTML = "<p>Could not load products. Open the site through Netlify or a local server, not by double-clicking the file.</p>"; });
</script>
</body>
</html>
